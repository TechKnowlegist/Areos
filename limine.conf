# Timeout in seconds that Limine will use before automatically booting.
timeout: 3

# Also show the boot menu on the serial port (the terminal), so it can be
# read with a screen reader.
serial: yes

# The normal way: AREOS with the desktop.
/AREOS
    protocol: limine
    path: boot():/boot/kernel

# Text only: straight to the command line, no desktop.
/AREOS (text only)
    protocol: limine
    path: boot():/boot/kernel
    cmdline: text
